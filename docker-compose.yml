services:
  app:
    build: .
    container_name: di-conservas-php-app
    ports:
      - "80:80"
    volumes:
      # Só o que muda em uso fica fora do container, para sobreviver a uma nova versão
      - ./assets/produtos:/var/www/html/assets/produtos
      - ./products.json:/var/www/html/products.json
      - ./data:/var/www/html/data
