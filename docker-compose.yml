services:
  app:
    build: .
    container_name: di-conservas-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      # As fotos sobrevivem a uma nova versão do container
      - ./public/assets/produtos:/var/www/html/public/assets/produtos
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-di_conservas}
      - DB_USER=${DB_USER:-di_user}
      - DB_PASS=${DB_PASS:?defina DB_PASS em um arquivo .env ao lado deste}
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - APP_DEBUG=${APP_DEBUG:-false}

  mysql:
    image: mysql:8.0
    container_name: di-conservas-mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME:-di_conservas}
      MYSQL_USER: ${DB_USER:-di_user}
      MYSQL_PASSWORD: ${DB_PASS:?defina DB_PASS em um arquivo .env ao lado deste}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/produtos-iniciais.sql:/docker-entrypoint-initdb.d/002-produtos.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

volumes:
  mysql_data:
