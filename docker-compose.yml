services:
  app:
    build:
      context: .
      args:
        INSTALL_LARAVEL: ${INSTALL_LARAVEL:-0}
    container_name: di-conservas-mvc-app
    depends_on:
      - mysql
    ports:
      - "80:80"
    volumes:
      # Estrutura MVC - monta apenas arquivos necessários para desenvolvimento
      - ./public:/var/www/html/public
      - ./app:/var/www/html/app
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./config:/var/www/html/config
      - ./products.json:/var/www/html/products.json
      - ./.env:/var/www/html/.env
      
      # Assets e uploads
      - ./public/assets:/var/www/html/public/assets
      
      # Logs e cache (para desenvolvimento)
      - ./storage/logs:/var/www/html/storage/logs
      
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      # Variáveis para conexão com MySQL
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-di_conservas}
      - DB_USERNAME=${DB_USERNAME:-di_user}
      - DB_PASSWORD=${DB_PASSWORD:-di_pass}
      # Configurações da aplicação
      - APP_NAME="Di Conservas MVC"
      - APP_ENV=development
      - APP_DEBUG=true
      - SESSION_TIMEOUT=600

  mysql:
    image: mysql:8.0
    container_name: di-conservas-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_DATABASE:-di_conservas}
      MYSQL_USER: ${DB_USERNAME:-di_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-di_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  mysql_data:
