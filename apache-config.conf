# Configuração do Apache para Di Conservas

<VirtualHost *:80>
    DocumentRoot /var/www/html
    ServerName localhost

    # Permite as regras de .htaccess, inclusive as que bloqueiam pastas internas
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/di-conservas_error.log
    CustomLog ${APACHE_LOG_DIR}/di-conservas_access.log combined
</VirtualHost>
