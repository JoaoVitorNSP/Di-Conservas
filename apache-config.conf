# Configuração do Apache para Di Conservas MVC

<VirtualHost *:80>
    # DocumentRoot agora aponta para a pasta public (padrão MVC)
    DocumentRoot /var/www/html/public
    ServerName localhost
    
    # Configuração principal da aplicação MVC
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
        
        # Força redirecionamento para index.php se arquivo não existir
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php [L,QSA]
    </Directory>
    
    # Protege diretórios sensíveis
    <Directory /var/www/html/app>
        Require all denied
    </Directory>
    
    <Directory /var/www/html/config>
        Require all denied
    </Directory>
    
    <Directory /var/www/html/resources>
        Require all denied
    </Directory>
    
    <Directory /var/www/html/routes>
        Require all denied
    </Directory>
    
    # Permite acesso aos assets
    <Directory /var/www/html/public/assets>
        AllowOverride None
        Require all granted
        
        # Cache para assets estáticos
        ExpiresActive On
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
    </Directory>
    
    # Suporte ao Laravel (se instalado)
    <Directory /var/www/html/laravel/public>
        AllowOverride All
        Require all granted
    </Directory>
    
    # Configurações de upload
    php_value upload_max_filesize 10M
    php_value post_max_size 10M
    php_value max_execution_time 300
    
    # Headers de segurança
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    
    # Compressão Gzip
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE application/xml
        AddOutputFilterByType DEFLATE application/xhtml+xml
        AddOutputFilterByType DEFLATE application/rss+xml
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/x-javascript
    </IfModule>
    
    ErrorLog ${APACHE_LOG_DIR}/di-conservas_error.log
    CustomLog ${APACHE_LOG_DIR}/di-conservas_access.log combined
</VirtualHost>
