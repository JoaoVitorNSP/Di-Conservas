# Configuração do Apache para Di Conservas: só a pasta public fica acessível.

<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    ServerName localhost

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/di-conservas_error.log
    CustomLog ${APACHE_LOG_DIR}/di-conservas_access.log combined
</VirtualHost>
